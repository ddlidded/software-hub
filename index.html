<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub</title>
<meta name="description" content="A personal hub for all your software links." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚡</span>
      <span class="brand-name" id="brand-name">Hub</span>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </button>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 id="title">Your software, in one place</h1>
      <p class="tagline" id="tagline">Every tool, one keystroke away.</p>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input id="search" type="search" placeholder="Search your tools…" autocomplete="off" spellcheck="false" aria-label="Search links" />
        <kbd class="hint">/</kbd>
      </div>
      <nav class="filters" id="filters" aria-label="Categories"></nav>
    </section>

    <div id="grid-root"></div>
    <p class="empty" id="empty" hidden>No tools match that search.</p>
  </main>

  <footer class="footer">
    <span>Press <kbd>/</kbd> to search · <kbd>Enter</kbd> opens the first result</span>
    <span>Edit <code>links.js</code> to add your own</span>
  </footer>

  <script src="links.js"></script>
  <script src="app.js"></script>
</body>
</html>
