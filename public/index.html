<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isotopiq Hub</title>
<meta name="description" content="A private hub for all your software links." />
<link rel="icon" type="image/png" href="assets/isotopiq-mark.png" />
<meta name="theme-color" content="#262262" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- Sign in / sign up gate -->
  <div class="gate" id="gate" hidden>
    <button class="icon-btn gate-theme" id="theme-toggle-gate" type="button" aria-label="Toggle color theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </button>
    <div class="panel auth-card">
      <div class="brand gate-brand">
        <img class="logo-light" src="assets/isotopiq-logo.png" alt="Isotopiq" />
        <img class="logo-dark" src="assets/isotopiq-logo-dark.png" alt="Isotopiq" />
      </div>
      <h2 id="auth-heading">Welcome back</h2>
      <p class="auth-sub" id="auth-sub">Sign in to see your links.</p>

      <form id="auth-form" novalidate>
        <label class="field" id="name-field" hidden>
          <span>Display name</span>
          <input id="auth-name" type="text" autocomplete="name" placeholder="Edmund" />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="auth-password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters" />
        </label>
        <p class="form-error" id="auth-error" role="alert" hidden></p>
        <button class="btn primary block" id="auth-submit" type="submit">Sign in</button>
      </form>

      <p class="auth-switch">
        <span id="switch-copy">New here?</span>
        <button class="link-btn" id="auth-switch" type="button">Create an account</button>
      </p>
    </div>
  </div>

  <!-- Authenticated app -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="logo-light" src="assets/isotopiq-logo.png" alt="Isotopiq" />
        <img class="logo-dark" src="assets/isotopiq-logo-dark.png" alt="Isotopiq" />
      </div>
      <div class="topbar-actions">
        <span class="who" id="who"></span>
        <button class="icon-btn" id="settings-open" type="button" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.03 1.56V21a2 2 0 11-4 0v-.11A1.7 1.7 0 007.9 19.3a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 003.54 15a1.7 1.7 0 00-1.54-1H2a2 2 0 110-4h.11A1.7 1.7 0 003.6 8.9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 008.96 4.5H9a2 2 0 114 0v.11a1.7 1.7 0 001.03 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V11a1.7 1.7 0 001.56 1.03H22a2 2 0 110 4h-.11a1.7 1.7 0 00-1.49 1.03z"/></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
        </button>
        <button class="btn ghost" id="logout" type="button">Sign out</button>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <h1 id="title">Your software, in one place</h1>
        <p class="tagline">Every tool, one keystroke away.</p>
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
          <input id="search" type="search" placeholder="Search your tools…" autocomplete="off" spellcheck="false" aria-label="Search links" />
          <kbd class="hint">/</kbd>
        </div>
        <nav class="filters" id="filters" aria-label="Categories"></nav>
      </section>

      <div id="grid-root"></div>
      <p class="empty" id="empty" hidden>No tools match that search.</p>
    </main>

    <footer class="footer">
      <span>Press <kbd>/</kbd> to search · <kbd>Enter</kbd> opens the first result</span>
      <span>Manage links in <button class="link-btn" id="settings-open-footer" type="button">Settings</button></span>
    </footer>
  </div>

  <!-- Settings drawer -->
  <div class="drawer-backdrop" id="settings" hidden>
    <aside class="drawer panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="drawer-head">
        <h2 id="settings-title">Settings</h2>
        <button class="icon-btn" id="settings-close" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <form class="link-form" id="link-form">
        <h3 id="form-title">Add a link</h3>
        <div class="row">
          <label class="field"><span>Name</span><input id="f-name" type="text" required placeholder="Figma" /></label>
          <label class="field"><span>Category</span><input id="f-category" list="category-options" type="text" placeholder="Design" /></label>
        </div>
        <datalist id="category-options"></datalist>
        <label class="field"><span>URL</span><input id="f-url" type="text" required placeholder="figma.com" /></label>
        <label class="field"><span>Description <em>optional</em></span><input id="f-description" type="text" placeholder="Design files" /></label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button class="btn primary" id="form-submit" type="submit">Add link</button>
          <button class="btn ghost" id="form-cancel" type="button" hidden>Cancel</button>
        </div>
      </form>

      <section class="manage">
        <h3>Your links <span class="count" id="manage-count">0</span></h3>
        <ul class="manage-list" id="manage-list"></ul>
      </section>
    </aside>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
